<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0f3a57" />
<title>جدول العيادات الخارجية | مستشفى الرس العام</title>
<style>
  body { margin: 0; font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif; background: #f2f5f8; color: #1c2e45; }
  #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  #gate .box { background: #fff; border: 1px solid #dbe3ea; border-radius: 16px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 8px 24px rgba(15, 58, 87, 0.08); }
  #gate h1 { font-size: 21px; margin: 0 0 6px; }
  #gate p { color: #5b6b7a; margin: 0 0 14px; font-size: 14px; }
  #gate input { width: 100%; box-sizing: border-box; font: inherit; font-size: 17px; padding: 11px 12px; border: 1px solid #b8c6d3; border-radius: 10px; margin-bottom: 10px; }
  #gate button { width: 100%; font: inherit; font-size: 16px; padding: 11px; border: 0; border-radius: 10px; background: #0f5a87; color: #fff; cursor: pointer; }
  #gate .err { color: #b42318; font-size: 14px; min-height: 20px; margin-top: 8px; }
  #gate a { color: #0f5a87; font-size: 14px; }
  .credit { direction: ltr; text-align: center; margin: 22px auto 0; padding-top: 12px; border-top: 1px solid #dbe3ea; max-width: 320px; line-height: 1.6; }
  .credit div, .credit span { color: #5b6b7a; font-size: 13px; }
  .credit strong { display: block; font-size: 16px; }
  #scheduleLaunch { display: none !important; }
</style>
</head>
<body>
<div id="gate">
  <form class="box" id="gateForm">
    <h1>جدول العيادات الخارجية</h1>
    <p>اكتب رقمك الوظيفي المسجّل في منصة العيادات الخارجية.</p>
    <input id="emp" inputmode="numeric" autocomplete="off" placeholder="الرقم الوظيفي" aria-label="الرقم الوظيفي" required />
    <button type="submit" id="go">دخول</button>
    <div class="err" id="err" role="alert"></div>
    <p style="margin-top: 10px">ما عندك صلاحية؟ اطلب «جدول العيادات: اطلاع» من حسابك في <a href="https://krm3300.github.io/outpatient-clinics-portal/">منصة العيادات الخارجية</a>.</p>
    <div class="credit"><div>Prepared by</div><strong>Khalid Rumayh Alrumayh</strong><span>Information Systems Specialist</span></div>
  </form>
</div>
<script>
(() => {
  const KEY = "opd-schedule-ok";
  const norm = (v) => String(v || "").replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, (d) => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\D/g, "");
  async function check(v) {
    try {
      const r = await fetch("https://omugonzzrulsdpnycact.supabase.co/rest/v1/rpc/opd_schedule_check", {
        method: "POST",
        headers: { apikey: "sb_publishable_f3IjPvIbMruO9jGb4SmT7Q_NOqgEbXs", "Content-Type": "application/json" },
        body: JSON.stringify({ p_empno: v }),
      });
      return r.ok && (await r.json()) === true;
    } catch (e) { return false; }
  }
  /* الجدول يُقرأ مباشرة من دليل الموظف الذكي، فيبقى دائماً نفس النسخة المحدّثة */
  async function show() {
    const h = await (await fetch("../?r=" + Date.now(), { cache: "no-store" })).text();
    const d = new DOMParser().parseFromString(h, "text/html");
    const layer = d.getElementById("scheduleLayer");
    const style = [...d.querySelectorAll("style")].find((s) => s.textContent.includes("#scheduleLayer"));
    const code = [...d.querySelectorAll("script")].find((s) => s.textContent.includes("SCH_DATA"));
    const launch = d.getElementById("scheduleLaunch");
    if (!layer || !style || !code || !launch) throw new Error("schedule");
    document.head.append(document.importNode(style, true));
    const close = layer.querySelector("#scheduleClose");
    if (close) { close.removeAttribute("onclick"); close.textContent = "→ المنصة"; close.href = "https://krm3300.github.io/outpatient-clinics-portal/"; }
    document.body.append(document.importNode(launch, true), document.importNode(layer, true));
    const s = document.createElement("script");
    s.textContent = code.textContent;
    document.body.append(s);
    document.getElementById("gate").remove();
    const L = document.getElementById("scheduleLayer");
    document.getElementById("scheduleLaunch").click();
    L.classList.add("open");
    L.style.display = "flex";
    const c = document.getElementById("scheduleClose");
    if (c) c.onclick = () => { location.href = c.href; };
    const cr = document.createElement("div");
    cr.className = "credit";
    cr.innerHTML = "<div>Prepared by</div><strong>Khalid Rumayh Alrumayh</strong><span>Information Systems Specialist</span>";
    document.getElementById("schedulePanel").append(cr);
  }
  const fail = (t) => { document.getElementById("err").textContent = t; document.getElementById("go").disabled = false; };
  document.getElementById("gateForm").onsubmit = async (e) => {
    e.preventDefault();
    const v = norm(document.getElementById("emp").value);
    if (!v) return fail("اكتب رقمك الوظيفي");
    document.getElementById("go").disabled = true;
    if (!(await check(v))) return fail("الرقم غير معتمد لجدول العيادات. اطلب الصلاحية من حسابك في المنصة.");
    try { sessionStorage.setItem(KEY, "yes"); } catch (e) {}
    show().catch(() => fail("تعذّر تحميل الجدول، حاول مرة ثانية."));
  };
  let ok = false;
  try { ok = sessionStorage.getItem(KEY) === "yes"; } catch (e) {}
  if (ok) show().catch(() => {});
})();
</script>
</body>
</html>
